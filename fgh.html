<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Привет, это я, Артём 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #a18cd1 100%);
    overflow: hidden;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.95);
    padding: 50px 40px;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    text-align: center;
    max-width: 520px;
    width: 100%;
    animation: appear 0.8s ease;
    position: relative;
    z-index: 10;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .emoji-big {
    font-size: 64px;
    margin-bottom: 10px;
    animation: bounce 1.5s infinite;
    display: inline-block;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    color: #c2185b;
    font-size: 26px;
    margin-bottom: 18px;
    line-height: 1.4;
  }

  .question {
    color: #4a148c;
    font-size: 22px;
    margin-bottom: 35px;
    line-height: 1.5;
    font-weight: 600;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 60px;
  }

  button {
    font-size: 22px;
    font-weight: 700;
    padding: 16px 45px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }

  #yesBtn {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #fff;
    box-shadow: 0 8px 20px rgba(67, 233, 123, 0.5);
  }

  #yesBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 28px rgba(67, 233, 123, 0.7);
  }

  #noBtn {
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    color: #fff;
    box-shadow: 0 8px 20px rgba(255, 106, 136, 0.5);
    position: relative;
    transition: left 0.25s ease-out, top 0.25s ease-out, transform 0.2s;
    z-index: 100;
  }

  /* ЭКРАН БЛАГОДАРНОСТИ */
  #thanksScreen {
    display: none;
    animation: appear 0.6s ease;
  }

  #thanksScreen h1 {
    font-size: 30px;
    color: #c2185b;
  }

  #thanksScreen p {
    font-size: 20px;
    color: #4a148c;
    line-height: 1.7;
    margin-top: 15px;
  }

  .heart {
    font-size: 40px;
    margin: 20px 0;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .signature {
    margin-top: 25px;
    font-style: italic;
    color: #888;
    font-size: 16px;
  }
</style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="emoji-big">💌</div>
    <h1>Привет, это я, Артём!</h1>
    <p class="question">Кристина, пойдёшь ли ты со мной<br>гулять в следующую субботу? 🌸</p>
    <div class="buttons" id="buttons">
      <button id="yesBtn">Да 💖</button>
      <button id="noBtn">Нет</button>
    </div>
  </div>

  <div class="card" id="thanksScreen">
    <div class="emoji-big">🥰</div>
    <h1>Спасибо, Кристина!</h1>
    <div class="heart">💗💗💗</div>
    <p>
      Ты самая настоящая зайка! 🐰<br>
      Я очень-очень рад, что ты согласилась.<br>
      Уже жду нашу субботу! ✨
    </p>
    <p class="signature">Твой Артём 💌</p>
  </div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const mainCard = document.getElementById('mainCard');
  const thanksScreen = document.getElementById('thanksScreen');

  // 30 случайных фраз для кнопки "Нет"
  const phrases = [
    'Нет',
    'Точно нет?',
    'Подумай ещё 🤔',
    'Уверена?',
    'Не уйдёшь 😏',
    'Попробуй ещё!',
    'Не поймаешь!',
    'А если да? 🥺',
    'Мимо!',
    'Почти!',
    'Ну пожалуйста 🙏',
    'Я старался 💪',
    'Не сегодня 😜',
    'Хитрая, да?',
    'Даже не мечтай',
    'Ты серьёзно?',
    'Поймай меня 🏃',
    'Слишком медленно!',
    'Опять не то 😅',
    'Ты уверена??',
    'Давай ещё раз',
    'Упс...',
    'Не выйдет 😌',
    'Я быстрее!',
    'Ммм, нет 😋',
    'Подумай о нас 🌹',
    'Соглашайся 💐',
    'Хи-хи 😄',
    'Не судьба!',
    'Нажми ДА лучше 💖'
  ];

  // Отслеживаем текущую позицию кнопки "Нет"
  let currentX = null;
  let currentY = null;
  let lastPhraseIndex = -1;

  // Минимальное расстояние между старой и новой позицией
  const MIN_DISTANCE = 220;

  // Получить случайную фразу (не повторяя предыдущую)
  function getRandomPhrase() {
    let idx;
    do {
      idx = Math.floor(Math.random() * phrases.length);
    } while (idx === lastPhraseIndex && phrases.length > 1);
    lastPhraseIndex = idx;
    return phrases[idx];
  }

  // Генерация новой позиции с проверкой расстояния
  function getNewPosition() {
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const margin = 20;
    const maxX = window.innerWidth - btnW - margin;
    const maxY = window.innerHeight - btnH - margin;

    // Размеры области вопроса (чтобы не перекрывать карточку "Да")
    const cardRect = mainCard.getBoundingClientRect();

    let newX, newY, attempts = 0;
    const MAX_ATTEMPTS = 50;

    while (attempts < MAX_ATTEMPTS) {
      newX = margin + Math.random() * (maxX - margin);
      newY = margin + Math.random() * (maxY - margin);

      // Проверка 1: не слишком близко к предыдущей позиции
      if (currentX !== null && currentY !== null) {
        const dx = newX - currentX;
        const dy = newY - currentY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < MIN_DISTANCE) {
          attempts++;
          continue;
        }
      }

      // Проверка 2: не перекрывает основную карточку (где кнопка "Да")
      const overlapsCard = !(
        newX + btnW < cardRect.left ||
        newX > cardRect.right ||
        newY + btnH < cardRect.top ||
        newY > cardRect.bottom
      );
      if (overlapsCard) {
        attempts++;
        continue;
      }

      // Проверка 3: не слишком близко к кнопке "Да"
      const yesRect = yesBtn.getBoundingClientRect();
      const centerX = newX + btnW / 2;
      const centerY = newY + btnH / 2;
      const yesCenterX = yesRect.left + yesRect.width / 2;
      const yesCenterY = yesRect.top + yesRect.height / 2;
      const distToYes = Math.sqrt(
        Math.pow(centerX - yesCenterX, 2) + Math.pow(centerY - yesCenterY, 2)
      );
      if (distToYes < 130) {
        attempts++;
        continue;
      }

      // Все проверки пройдены
      return { x: newX, y: newY };
    }

    // Если не нашли идеальную позицию — берём последнюю сгенерированную
    return { x: newX, y: newY };
  }

  // Кнопка "Нет" убегает
  function runAway() {
    // Меняем текст на случайную фразу
    noBtn.textContent = getRandomPhrase();

    // Фиксируем позицию, если ещё не зафиксирована
    if (noBtn.style.position !== 'fixed') {
      const rect = noBtn.getBoundingClientRect();
      noBtn.style.position = 'fixed';
      noBtn.style.left = rect.left + 'px';
      noBtn.style.top = rect.top + 'px';
      currentX = rect.left;
      currentY = rect.top;
      // Даём браузеру применить стили перед перемещением
      void noBtn.offsetWidth;
    }

    // Находим новую позицию
    const pos = getNewPosition();

    // Плавно перемещаем
    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';

    currentX = pos.x;
    currentY = pos.y;
  }

  noBtn.addEventListener('mouseover', runAway);
  noBtn.addEventListener('click', runAway);
  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    runAway();
  });

  // Кнопка "Да"
  yesBtn.addEventListener('click', function() {
    mainCard.style.display = 'none';
    thanksScreen.style.display = 'block';
    for (let i = 0; i < 30; i++) {
      setTimeout(createHeart, i * 60);
    }
  });

  // Падающие сердечки
  function createHeart() {
    const heart = document.createElement('div');
    heart.textContent = ['💖','💗','💕','🌸','✨','💞'][Math.floor(Math.random()*6)];
    heart.style.position = 'fixed';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.top = '-50px';
    heart.style.fontSize = (20 + Math.random() * 25) + 'px';
    heart.style.pointerEvents = 'none';
    heart.style.zIndex = '999';
    heart.style.transition = 'transform 3s linear, top 3s linear, opacity 3s';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.style.top = '110vh';
      heart.style.transform = `rotate(${Math.random()*720 - 360}deg)`;
      heart.style.opacity = '0';
    }, 50);

    setTimeout(() => heart.remove(), 3200);
  }

  // При изменении размера окна — если кнопка улетела за пределы, вернём её
  window.addEventListener('resize', () => {
    if (noBtn.style.position === 'fixed') {
      const rect = noBtn.getBoundingClientRect();
      if (rect.right > window.innerWidth || rect.bottom > window.innerHeight) {
        const pos = getNewPosition();
        noBtn.style.left = pos.x + 'px';
        noBtn.style.top = pos.y + 'px';
        currentX = pos.x;
        currentY = pos.y;
      }
    }
  });
</script>

</body>
</html>
